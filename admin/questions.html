<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Question Bank — Tallentex Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="theme-color" content="#1f3a8a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Tallentex" />
<script src="../js/pwa.js" defer></script>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <h1 style="font-size:1.1rem;margin:0;">Question Bank</h1>
      <div class="flex gap-8">
        <button class="btn btn-secondary btn-sm" id="export-json-btn">Export JSON</button>
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;">Import JSON<input type="file" id="import-json-input" accept="application/json" hidden /></label>
        <button class="btn btn-primary btn-sm" id="new-question-btn">+ Add Question</button>
      </div>
    </header>
    <main class="admin-content">
      <div class="toolbar">
        <input type="search" id="question-search" placeholder="Search question text…" style="min-width:220px;" />
        <select id="filter-subject"><option value="">All Subjects</option><option>Mathematics</option><option>Physics</option><option>Chemistry</option><option>Biology</option></select>
        <select id="filter-class"><option value="">All Classes</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select>
        <select id="filter-difficulty"><option value="">All Difficulties</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
      </div>
      <div id="question-list"></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="question-modal">
  <div class="modal" style="max-width:600px;max-height:88vh;overflow-y:auto;">
    <h3>Question</h3>
    <form id="question-form">
      <div class="field-row">
        <div class="field"><label>Subject</label><input name="subject" list="subject-list" required /></div>
        <div class="field"><label>Class</label><input name="qClass" placeholder="e.g. Class 10" required /></div>
      </div>
      <datalist id="subject-list"><option>Mathematics</option><option>Physics</option><option>Chemistry</option><option>Biology</option></datalist>
      <div class="field"><label>Chapter / Topic</label><input name="topic" /></div>
      <div class="field"><label>Question</label><textarea name="questionText" required></textarea></div>
      <div class="field"><label>Option A</label><input name="optA" required /></div>
      <div class="field"><label>Option B</label><input name="optB" required /></div>
      <div class="field"><label>Option C</label><input name="optC" required /></div>
      <div class="field"><label>Option D</label><input name="optD" required /></div>
      <div class="field">
        <label>Correct Answer</label>
        <select name="correctAnswer" required>
          <option value="0">Option A</option><option value="1">Option B</option>
          <option value="2">Option C</option><option value="3">Option D</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Marks</label><input name="marks" type="number" step="0.5" value="4" required /></div>
        <div class="field"><label>Negative Marks</label><input name="negativeMarks" type="number" step="0.5" value="1" required /></div>
        <div class="field">
          <label>Difficulty</label>
          <select name="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
        </div>
      </div>
      <div class="field"><label>Tags (comma-separated)</label><input name="tags" /></div>
      <div class="field"><label>Explanation</label><textarea name="explanation"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="close-question-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Question</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/ui-utils.js"></script>
<script src="../js/presence.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script>
  requireAuth((profile) => initQuestionsPage(profile), true);
</script>
</body>
</html>
