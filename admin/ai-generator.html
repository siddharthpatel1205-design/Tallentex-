<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Question Generator — Tallentex Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="theme-color" content="#1f3a8a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Tallentex" />
<script src="../js/pwa.js" defer></script>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
  <div class="admin-main">
    <header class="admin-header"><h1 style="font-size:1.1rem;margin:0;">AI Question Generator</h1></header>
    <main class="admin-content">
      <div class="grid" style="grid-template-columns: 1fr 1.2fr;align-items:start;">
        <div class="card">
          <form id="ai-generator-form">
            <div class="field"><label>Class</label><input name="aiClass" placeholder="e.g. Class 10" required /></div>
            <div class="field"><label>Subject</label><input name="aiSubject" placeholder="e.g. Physics" required /></div>
            <div class="field"><label>Chapter / Topic</label><input name="aiTopic" placeholder="e.g. Laws of Motion" required /></div>
            <div class="field">
              <label>Difficulty</label>
              <select name="aiDifficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="mixed">Mixed</option></select>
            </div>
            <div class="field-row">
              <div class="field"><label>Number of Questions</label><input name="aiCount" type="number" min="1" max="50" value="10" required /></div>
              <div class="field"><label>Marks</label><input name="aiMarks" type="number" step="0.5" value="4" /></div>
              <div class="field"><label>Negative Marks</label><input name="aiNegativeMarks" type="number" step="0.5" value="1" /></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Generate Questions</button>
          </form>
          <p class="hint mt-16">Generated questions are never added automatically — review and approve each one before it enters the Question Bank.</p>
        </div>
        <div>
          <h3>Generated Questions</h3>
          <div id="ai-generated-list"><p class="text-muted">Configure and generate to see questions here.</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/ui-utils.js"></script>
<script src="../js/presence.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script>
  requireAuth((profile) => initAIGeneratorPage(profile), true);
</script>
</body>
</html>
