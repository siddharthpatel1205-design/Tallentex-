<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — Tallentex Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="theme-color" content="#1f3a8a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Tallentex" />
<script src="../js/pwa.js" defer></script>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
  <div class="admin-main">
    <header class="admin-header"><h1 style="font-size:1.1rem;margin:0;">Messages</h1></header>
    <main class="admin-content">
      <div class="grid" style="grid-template-columns: 1fr 1.4fr;align-items:start;">
        <div class="card">
          <h3>Send a message</h3>
          <form id="message-form">
            <div class="field"><label>To</label><select id="message-target" name="messageTarget"></select></div>
            <div class="field"><label>Message</label><textarea name="messageText" placeholder="e.g. Please complete your test before the timer ends."></textarea></div>
            <div class="field"><label>Image (optional)</label><input type="file" name="messageImage" id="message-image" accept="image/*" /><div class="hint">Text, image, or both. Students can reply with text/image.</div></div>
            <button type="submit" class="btn btn-primary btn-block">Send</button>
          </form>
          <p class="hint mt-16">Online users see this instantly as a popup with your photo, an OK button and a Reply button. Offline users see it the moment they next log in.</p>
        </div>
        <div>
          <h3>Message History</h3>
          <div id="message-history"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/ui-utils.js"></script>
<script src="../js/presence.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script>
  requireAuth((profile) => initMessagesPage(profile), true);
</script>
</body>
</html>
